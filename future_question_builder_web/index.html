<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Question Builder</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><header><div><div class="eyebrow">SPACE_Q STUDIO</div><h1>Future Question Builder</h1><p>Thiết lập bài tập trực quan bằng chuột, giữ nguyên serializer, audio và runtime hiện có.</p></div><div class="actions"><label class="button ghost">Mở .Space_Q<input id="loadFile" type="file" accept=".Space_Q" hidden></label><label class="button ghost">Nhập câu hỏi TXT<input id="importTxt" type="file" accept=".txt,.csv" hidden></label><button id="build">Build Space_Q</button><button id="preview" class="accent">Chạy thử HTML</button></div></header><section class="toolbar"><label>Tiêu đề<input id="title" value="Future Question"></label><label>Thứ tự<select id="order"><option value="sequence">Theo thứ tự</option><option value="shuffle">Xáo node</option></select></label><label>Crystal name<input id="crystalName" value="Prism Crystal"></label><label>Crystal use<input id="crystalUse" value="Stores learning energy for future item upgrades."></label></section><main><aside><div class="side-head"><span>Root nodes</span><button id="addNode">+ Node</button></div><div id="nodes"></div><div class="tip">Chuột phải vào Root hoặc câu hỏi để mở đầy đủ popup thiết đặt. Di chuột lên dấu ? để xem hướng dẫn.</div></aside><article><div id="editor"></div><div class="status" id="status">Sẵn sàng.</div><pre id="log"></pre></article></main></div><script src="app.js"></script></body></html>
