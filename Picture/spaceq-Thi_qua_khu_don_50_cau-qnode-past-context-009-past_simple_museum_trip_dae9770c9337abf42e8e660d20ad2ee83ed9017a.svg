<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="70" y="60" width="1060" height="640" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <text x="600" y="120" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#0f172a">Yesterday's Museum Trip</text>
  <g font-family="Arial" font-size="32" fill="#111827">
    <text x="130" y="205">1. 7:00 a.m. - Class 8A left school by bus.</text>
    <text x="130" y="285">2. 8:15 a.m. - A guide showed old maps and tools.</text>
    <text x="130" y="365">3. 12:00 p.m. - The students had lunch in the garden.</text>
    <text x="130" y="445">4. 1:30 p.m. - They watched a short film.</text>
    <text x="130" y="525">5. 4:00 p.m. - Everyone returned to school.</text>
  </g>
  <rect x="108" y="166" width="835" height="58" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="14 10"/>
  <rect x="108" y="246" width="875" height="58" fill="none" stroke="#22c55e" stroke-width="6" stroke-dasharray="14 10"/>
